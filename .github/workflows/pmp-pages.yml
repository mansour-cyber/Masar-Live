name: Deploy PMP Teacher Studio to Pages

on:
  push:
    branches: [main]
    paths:
      - 'pmp/**'
      - '.github/workflows/pmp-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pmp-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload PMP site
        uses: actions/upload-pages-artifact@v4
        with:
          path: './pmp'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
